name: Add-on CI

on:
  push:
    paths:
      - "smart_city_poles/**"
      - "tests/addon/**"
      - "repository.yaml"
      - ".github/workflows/addon-ci.yaml"
  pull_request:
    paths:
      - "smart_city_poles/**"
      - "tests/addon/**"
      - "repository.yaml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint and render tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML files and config schema
        run: |
          python3 - <<'EOF'
          import glob
          import yaml

          files = (
              ["repository.yaml", "smart_city_poles/config.yaml", "smart_city_poles/build.yaml"]
              + glob.glob("smart_city_poles/translations/*.yaml")
          )
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"{f} OK")

          cfg = yaml.safe_load(open("smart_city_poles/config.yaml"))
          assert set(cfg["options"]) == set(cfg["schema"]), "options/schema mismatch"
          assert cfg["ingress_port"] == 8099
          assert cfg["ingress"] is True
          for lang in glob.glob("smart_city_poles/translations/*.yaml"):
              tr = yaml.safe_load(open(lang))["configuration"]
              missing = set(cfg["schema"]) - set(tr)
              assert not missing, f"{lang}: untranslated options {missing}"
          print("config.yaml options <-> schema <-> translations OK")
          EOF

      - name: Shell syntax check
        run: |
          for f in smart_city_poles/rootfs/etc/s6-overlay/s6-rc.d/*/run \
                   smart_city_poles/rootfs/usr/bin/smart-poles-render; do
            bash -n "$f" && echo "$f OK"
          done

      - name: Render with the default options
        run: |
          python3 -c "
          import json, yaml
          o = yaml.safe_load(open('smart_city_poles/config.yaml'))['options']
          o['install_energy_package'] = True
          o['shelly_energy_entity'] = 'sensor.shelly_energy'
          json.dump(o, open('/tmp/options-default.json', 'w'))
          "
          smart_city_poles/rootfs/usr/bin/smart-poles-render /tmp/options-default.json \
            smart_city_poles/rootfs/usr/src /tmp/out-default /tmp/out-default/config.json
          python3 tests/addon/check_render.py /tmp/out-default /tmp/options-default.json

      - name: Render with 5 poles and custom neighbours
        run: |
          smart_city_poles/rootfs/usr/bin/smart-poles-render tests/addon/options-5-poles.json \
            smart_city_poles/rootfs/usr/src /tmp/out-5 /tmp/out-5/config.json
          python3 tests/addon/check_render.py /tmp/out-5 tests/addon/options-5-poles.json

      - name: Invalid options are rejected
        run: |
          set +e
          fail() { echo "expected failure for: $1"; exit 1; }
          check() {
            jq "$2" tests/addon/options-5-poles.json > /tmp/bad.json
            smart_city_poles/rootfs/usr/bin/smart-poles-render /tmp/bad.json \
              smart_city_poles/rootfs/usr/src /tmp/out-bad 2>/tmp/err && fail "$1"
            grep -q "$3" /tmp/err || { cat /tmp/err; fail "$1 (message)"; }
            echo "rejected: $1"
          }
          check "duplicate id"        '.poles[1].id = "p1"'              'used more than once'
          check "unknown neighbour"   '.poles[0].neighbors = "p9"'       'not a configured pole id'
          check "self neighbour"      '.poles[0].neighbors = "p1"'       'own neighbor'
          check "non-light lamp"      '.poles[0].light = "switch.x"'     'must be a light'
          check "shared presence"     '.poles[1].presence = .poles[0].presence' 'more than one pole'
          check "lux thresholds"      '.lux_night_below = 80'            'must be lower'
          check "no poles"            '.poles = []'                      'at least one pole'

      - name: Dashboard is self-contained and config driven
        run: |
          f=smart_city_poles/rootfs/www/index.html
          test -s "$f"
          grep -q 'vendor/leaflet.js' "$f"
          grep -q 'vendor/chart.umd.min.js' "$f"
          grep -q "config.json" "$f"
          ! grep -E '<(script|link)[^>]+https?://' "$f" || { echo "external script/style found"; exit 1; }
          echo "dashboard OK"

      - name: Validate Grafana templates
        run: |
          python3 - <<'EOF'
          import json, yaml

          ds = open("smart_city_poles/rootfs/usr/src/grafana/datasource.yaml.tpl").read()
          ds = ds.replace("__INFLUX_USER__", "grafana").replace("__INFLUX_PASS__", "secret")
          ds = yaml.safe_load(ds)
          assert ds["datasources"][0]["uid"] == "influxdb-kolones"

          prov = yaml.safe_load(open("smart_city_poles/rootfs/usr/src/grafana/dashboards_provider.yaml"))
          assert prov["providers"][0]["options"]["path"] == "/share/grafana-provisioning/dashboards"

          raw = open("smart_city_poles/rootfs/usr/src/grafana/kolones-patras.json").read()
          rendered = json.loads(raw.replace("${DS_INFLUXDB}", "influxdb-kolones"))
          print("grafana OK:", rendered["title"], "| panels:", len(rendered["panels"]))
          EOF

  build:
    name: Build add-on image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22 \
            --tag smart-city-poles:test \
            smart_city_poles/

      - name: nginx config is valid and the renderer runs inside the image
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/tests/addon:/tests:ro" smart-city-poles:test -c '
              set -e
              echo "127.0.0.1 supervisor" >> /etc/hosts
              sed "s|__SUPERVISOR_TOKEN__|test|g" /etc/nginx/http.d/ingress.conf.tpl > /etc/nginx/http.d/ingress.conf
              nginx -t
              smart-poles-render /tests/options-5-poles.json /usr/src /tmp/out /www/config.json
              ls /www/vendor/leaflet.js /www/vendor/chart.umd.min.js /www/config.json
            '
