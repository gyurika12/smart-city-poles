server {
    listen 8099;

    root /www;
    index index.html;

    location / {
        # Single-file dashboard: every path (incl. the ingress prefix) serves it.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
    }
}
