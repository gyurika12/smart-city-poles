<script>
// === ΣΥΝΔΕΣΗ ΜΕ HOME ASSISTANT ===================================
// Η σελίδα σερβίρεται από το add-on (ingress). Όλες οι κλήσεις πάνε σχετικά
// με τη διεύθυνσή της (π.χ. /api/hassio_ingress/<token>/api/states) και το
// nginx του add-on τις προωθεί στο Home Assistant με το token του Supervisor.
// Δεν χρειάζεται token στον browser.
const BASE = location.pathname.replace(/[^/]*$/, '');
const POLL_MS = 5000;
const RENDER_MS = 1000;
const HISTORY_HOURS = 24;
const HISTORY_MAX_POINTS = 96;
const STALE_MS = 120000;
// Γεμίζει από το config.json (παράγεται από τις ρυθμίσεις του add-on)
let CFG = { poles: [], demo_poles: false, map_zoom: 16 };
let COLUMNS = [];
// ===== Μετρήσεις: ετικέτα, μονάδα, δεκαδικά =====
const META = {
  temperature:{label:'Θερμοκρασία',unit:'°C',d:1,icon:'🌡️'},
  humidity:{label:'Υγρασία',unit:'%',d:0,icon:'💧'},
  pressure:{label:'Πίεση',unit:'hPa',d:1,icon:'📊'},
  eco2:{label:'CO₂',unit:'ppm',d:0,icon:'🟢'},
  tvoc:{label:'TVOC',unit:'ppb',d:0,icon:'🧪'},
  lux:{label:'Φωτεινότητα',unit:'lx',d:0,icon:'☀️'},
  uv:{label:'UV Index',unit:'',d:1,icon:'🟣'},
  gas:{label:'Αέριο',unit:'',d:0,icon:'🛢️'},
  gas_bme:{label:'Αέριο (BME)',unit:'Ω',d:0,icon:'🔬'},
  air_quality:{label:'Ποιότητα αέρα',unit:'',d:0,icon:'💨'},
  ldr:{label:'LDR 1',unit:'',d:0,icon:'🔆'},
  ldr2:{label:'LDR 2',unit:'',d:0,icon:'🔆'},
  tof:{label:'Απόσταση ToF',unit:'mm',d:0,icon:'📏'},
  ultrasonic:{label:'Απόσταση US',unit:'cm',d:1,icon:'📡'},
  water_level:{label:'Στάθμη νερού',unit:'',d:0,icon:'💧'},
  flame:{label:'Φλόγα',unit:'',d:0,icon:'🔥'},
  audio:{label:'Ήχος',unit:'',d:0,icon:'🔊'},
  light_level:{label:'Στάθμη φωτός',unit:'',d:0,icon:'☀️'},
  motion:{label:'Κίνηση',unit:'',d:0,icon:'🚶'},
  rain:{label:'Βροχή',unit:'',d:0,icon:'🌧️'},
  presence:{label:'Παρουσία',unit:'',d:0,icon:'👤'},
  lora_payload:{label:'LoRa',unit:'',d:0,icon:'📶'},
};
const KPI_ORDER = ['temperature','humidity','pressure','eco2','tvoc','lux','uv','air_quality','gas','gas_bme','ldr','ldr2'];
const CHART_ORDER = ['temperature','humidity','pressure','eco2','lux','ldr','tvoc','gas'];
const TEXT_KEYS = new Set(['motion','rain','presence','lora_payload','led_state','led_mode','led_switch']);
// ===== Αναγνώριση αισθητήρα από device_class / όνομα entity =====
// Η σειρά μετράει: το πιο συγκεκριμένο πρώτα (ldr2 πριν το ldr, gas_bme πριν το gas).
const RULES = [
  ['led_mode',     (d,id)=> d==='select' && /led/.test(id)],
  ['led_switch',   (d,id)=> d==='switch' && /led/.test(id)],
  ['led_state',    (d,id)=> d==='binary_sensor' && /led/.test(id)],
  ['presence',     (d,id,dc)=> d==='binary_sensor' && (/laser|presence|occupancy/.test(id) || dc==='occupancy' || dc==='presence')],
  ['motion',       (d,id,dc)=> /motion|kinese|kinisi|pir/.test(id) || dc==='motion'],
  ['rain',         (d,id,dc)=> /rain|brokhe|vroxi|vrochi/.test(id) || dc==='moisture'],
  ['lora_payload', (d,id)=> /lora/.test(id)],
  ['lux',          (d,id,dc)=> dc==='illuminance' || /lux|photeinoteta|foteinotita/.test(id)],
  ['uv',           (d,id)=> /(^|_)uv(_|$)|uv_?index/.test(id)],
  ['eco2',         (d,id,dc)=> dc==='carbon_dioxide' || /e?co2/.test(id)],
  ['tvoc',         (d,id,dc)=> /^volatile_organic_compounds/.test(dc||'') || /tvoc/.test(id)],
  ['gas_bme',      (d,id)=> /(gas|aerio)_bme/.test(id)],
  ['air_quality',  (d,id,dc)=> dc==='aqi' || /air_?q/.test(id)],
  ['gas',          (d,id,dc)=> dc==='gas' || /gas|aerio/.test(id)],
  ['temperature',  (d,id,dc)=> dc==='temperature' || /temp|thermokrasia/.test(id)],
  ['humidity',     (d,id,dc)=> dc==='humidity' || /humid|ygrasia/.test(id)],
  ['pressure',     (d,id,dc)=> dc==='pressure' || dc==='atmospheric_pressure' || /press|piesi/.test(id)],
  ['ldr2',         (d,id)=> /ldr_?2/.test(id)],
  ['ldr',          (d,id)=> /ldr/.test(id)],
  ['tof',          (d,id,dc,u)=> /tof/.test(id) || (dc==='distance' && u==='mm')],
  ['ultrasonic',   (d,id,dc,u)=> /(^|_)us(_|$)|ultrason|distance_us/.test(id) || (dc==='distance' && u==='cm')],
  ['water_level',  (d,id)=> /water/.test(id)],
  ['flame',        (d,id)=> /flame|fotia/.test(id)],
  ['audio',        (d,id)=> /audio|sound|ixos|hxos/.test(id)],
  ['light_level',  (d,id)=> /light_level/.test(id)],
];
const IGNORE_DOMAINS = new Set(['automation','script','update','button','camera','image','scene','device_tracker','event']);
function classify(ent){
  const [dom, obj] = ent.entity_id.split('.');
  const a = ent.attributes || {};
  const dc = a.device_class, u = a.unit_of_measurement;
  for(const [key, test] of RULES){ if(test(dom, obj, dc, u)) return key; }
  return null;
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ===== Parking (HC-SR04): ενεργό όταν η κολώνα έχει parking_occupied_cm =====
function hasParking(col){ return !!col.parking; }
function parkingState(col){ const s=state[col.id]; const d=val(col,'ultrasonic'); if(d===null) return {known:false}; const dist=Number(d); const cfg=col.parking||{occ_cm:50,free_cm:60}; if(s._parkHyst===undefined) s._parkHyst=false; if(dist<0) s._parkHyst=false; else if(cfg.max_cm && dist>cfg.max_cm) {} else if(dist<=cfg.occ_cm) s._parkHyst=true; else if(dist>=cfg.free_cm) s._parkHyst=false; return {known:true, occupied:s._parkHyst, dist}; }
const state = {}; let myMap = null, activeCharts = {}, currentView = 'map', currentDashCol = null, dark = true, pollutionLayer = null, pollutionOn = false; const markerRefs = {}; let dashBuiltFor = null, allStatesCache = null, cmpCharts = {}, cmpBuilt = false, deviceEntities = {};
function initState(){ COLUMNS.forEach(c => state[c.id] = { v:{}, ts:{}, ent:{}, others:[], history:{}, lamp:null, online:false }); }
// Τιμή μέτρησης ή null
function val(col,k){ const s=state[col.id]; const v=s && s.v[k]; return (v===undefined||v===null) ? null : v; }
async function haGet(path){ const r = await fetch(BASE + path, { credentials:'same-origin' }); if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }
async function haPost(path, body){ const r = await fetch(BASE + path, { method:'POST', credentials:'same-origin', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }); if(!r.ok) throw new Error(`HTTP ${r.status}`); const t = await r.text(); try{ return JSON.parse(t); }catch(_){ return t; } }
function num(x){ const v = parseFloat(x); return Number.isFinite(v) ? v : null; }
function fmt(v,d=1){ return v===null||v===undefined||!Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(d); }
function ago(ts){ if(!ts) return ''; const s=Math.round((Date.now()-ts)/1000); if(s<5) return 'τώρα'; if(s<60) return `${s}δ πριν`; if(s<3600) return `${Math.floor(s/60)}λ πριν`; return `${Math.floor(s/3600)}ω πριν`; }
function stale(ts){ return !ts || Date.now()-ts > STALE_MS; }
function unavailable(ent){ return !ent || ent.state==='unavailable' || ent.state==='unknown'; }
function pushHist(s, key, v, t){ if(!s.history[key]) s.history[key]=[]; const h = s.history[key]; const last = h[h.length-1]; if(last && last.t===t) return; h.push({ t:t||Date.now(), v }); if(h.length > HISTORY_MAX_POINTS) h.shift(); }
function downsample(pts, max){ if(pts.length <= max) return pts; const step = pts.length / max, out = []; for(let i=0; i<max; i++) out.push(pts[Math.floor(i*step)]); return out; }
function setStatus(cls, text){ const dot = document.getElementById('status-dot'); dot.className = `mqtt-dot ${cls}`; document.getElementById('status-pill').textContent = text; }
function isOnline(col){ if(col.fake) return true; const s=state[col.id]; if(col.status_entity) return s.online; return Object.values(s.ts).some(t=>!stale(t)); }
/* ---------- ROUTING: deep-link μέσω hash (#dashboard-col1 / #overview / #map / ,embed) ---------- */
function parseHash(){ const raw=decodeURIComponent((location.hash||'').replace(/^#/,'')); const parts=raw.split(/[,&]/).map(s=>s.trim()).filter(Boolean); let view=null,col=null,embed=false; for(const p of parts){ if(p==='embed') embed=true; else if(p==='map'||p==='overview'||p==='comparison') view=p; else { const m=p.match(/^dashboard-(.+)$/i); if(m){ view='dashboard'; col=m[1]; } } } return { view, col, embed }; }
function applyInitialRoute(){ const r=parseHash(); if(r.embed) document.body.classList.add('embed'); if(r.view==='dashboard' && COLUMNS.some(c=>c.id===r.col)){ openDashboard(r.col); } else if(r.view==='overview'){ showView('overview'); } else if(r.view==='comparison'){ showView('comparison'); } else { showView('map'); } }
function syncHash(){ const embed=document.body.classList.contains('embed')?',embed':''; let h='map'; if(currentView==='overview') h='overview'; else if(currentView==='comparison') h='comparison'; else if(currentView==='dashboard') h='dashboard-'+currentDashCol; try{ history.replaceState(null,'','#'+h+embed); }catch(_){} }
/* ---------- Ψηφιακές (demo) κολώνες: live προσομοίωση, χωρίς MQTT ---------- */
const DEMO_COLORS = ["#c084fc","#38bdf8","#fb7185","#34d399","#f59e0b","#a3e635","#f472b6"];
function makeDemoPoles(center){ const out=[]; for(let i=0;i<7;i++){ const a=i/7*Math.PI*2, r=0.004+0.002*(i%3); out.push({ id:'demo'+(i+1), name:'Demo '+(i+1), location:'Ψηφιακή κολώνα', lat:center[0]+Math.sin(a)*r, lng:center[1]+Math.cos(a)*r*1.3, color:DEMO_COLORS[i], fake:true, bias:[0.85,0.5,0.72,0.18,0.4,0.28,0.63][i] }); } return out; }
function rw(cur,min,max,step){ if(cur===null||cur===undefined||!Number.isFinite(cur)) cur=(min+max)/2; let v=cur+(Math.random()-0.5)*step; return Math.max(min,Math.min(max,v)); }
function simulateFake(){ const now=Date.now(); for(const c of COLUMNS){ if(!c.fake) continue; const s=state[c.id], v=s.v, b=c.bias; v.temperature=rw(v.temperature,8,34,0.6); v.humidity=rw(v.humidity,30,92,2.2); v.pressure=rw(v.pressure,1004,1024,0.4); v.eco2=rw(v.eco2,420+b*260,640+b*1100,38); v.tvoc=rw(v.tvoc,40+b*120,180+b*700,22); v.ldr=rw(v.ldr,40,960,55); v.air_quality=rw(v.air_quality,10+b*40,40+b*150,8); for(const k of ['temperature','humidity','pressure','eco2','tvoc','ldr','air_quality']){ s.ts[k]=now; pushHist(s,k,v[k],now); } } }
/* ---------- Δείκτης ρύπανσης + overlay χάρτη ---------- */
function clamp01(v){ return Math.max(0,Math.min(100,v)); }
function pollutionIndex(c){ const eco2=val(c,'eco2'), tvoc=val(c,'tvoc'), aq=val(c,'air_quality'), gas=val(c,'gas'); const parts=[]; if(eco2!==null) parts.push(clamp01((eco2-420)/(1050-420)*100)); if(tvoc!==null) parts.push(clamp01(tvoc/7)); if(aq!==null) parts.push(clamp01(aq/1.5)); if(eco2===null&&gas!==null) parts.push(clamp01(gas/2.2)); if(!parts.length) return null; const mx=Math.max(...parts), av=parts.reduce((a,b)=>a+b,0)/parts.length; return clamp01(0.65*mx+0.35*av); }
function pollutionColor(v){ return v===null?'#9a9a9a':v<20?'#27c24c':v<40?'#e8c534':v<65?'#f5872f':'#e23b3b'; }
function pollutionLabel(v){ return v===null?'Χωρίς αισθητήρα':v<20?'Καλή':v<40?'Μέτρια':v<65?'Επιβαρυμένη':'Υψηλή'; }
function updatePollution(){ if(!pollutionLayer) return; pollutionLayer.clearLayers(); if(!pollutionOn) return; for(const c of COLUMNS){ const v=pollutionIndex(c); if(v===null) continue; const col=pollutionColor(v); [{r:360,o:0.12},{r:230,o:0.20},{r:130,o:0.32},{r:60,o:0.46}].forEach(ring=>{ L.circle([c.lat,c.lng],{radius:ring.r,stroke:false,fillColor:col,fillOpacity:ring.o,interactive:false}).addTo(pollutionLayer); }); } }
function togglePollution(){ pollutionOn=!pollutionOn; document.getElementById('pollution-toggle').classList.toggle('active',pollutionOn); document.getElementById('poll-legend').classList.toggle('show',pollutionOn); updatePollution(); }
/* ---------- Ανακάλυψη entities ανά κολώνα ---------- */
// Το entity ανήκει στην κολώνα αν (α) είναι στην ίδια συσκευή με τον αισθητήρα
// παρουσίας της ή (β) το entity_id περιέχει ένα από τα tokens του entity_match
// ως ολόκληρη λέξη (π.χ. "col1" ταιριάζει στο sensor.col1_temp, όχι στο col10).
function matcher(col){ const toks=(col.entity_match||[]).map(t=>t.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); if(!toks.length) return ()=>false; const re=new RegExp('[._]('+toks.join('|')+')(?=_|$)'); return id=>re.test(id); }
function poleEntities(col, all){ const m=matcher(col); const dev=new Set(deviceEntities[col.id]||[]); return all.filter(e=>{ const id=e.entity_id; if(IGNORE_DOMAINS.has(id.split('.')[0])) return false; return dev.has(id) || m(id); }); }
async function discoverDevices(){ const real=COLUMNS.filter(c=>!c.fake); if(!real.length) return; const pairs=real.map(c=>`[${JSON.stringify(c.id)},${JSON.stringify(c.presence)}]`).join(','); const tpl=`{% set ns = namespace(l=[]) %}{% for k, e in [${pairs}] %}{% set d = device_id(e) %}{% set ns.l = ns.l + [[k, device_entities(d) if d else []]] %}{% endfor %}{{ ns.l | tojson }}`; try{ const res=await haPost('api/template',{template:tpl}); const arr=typeof res==='string'?JSON.parse(res):res; deviceEntities=Object.fromEntries(arr); }catch(_){ deviceEntities={}; } }

function mapEntities(all){ const byId=new Map(all.map(e=>[e.entity_id,e])); for(const c of COLUMNS){ if(c.fake) continue; const s=state[c.id]; const ent={}, others=[]; const fixed=new Set([c.light, c.presence]); ent.presence=c.presence; for(const e of poleEntities(c, all)){ if(fixed.has(e.entity_id)) continue; const k=classify(e); if(k && !ent[k]) ent[k]=e.entity_id; else if(e.entity_id.startsWith('sensor.') || e.entity_id.startsWith('binary_sensor.')) others.push(e.entity_id); } s.ent=ent; s.others=others; s.missing=[c.light,c.presence,c.status_entity].filter(x=>x && !byId.has(x)); } }
function applyStates(all){ const byId=new Map(all.map(e=>[e.entity_id,e])); for(const c of COLUMNS){ if(c.fake) continue; const s=state[c.id]; if(c.status_entity){ s.online=!unavailable(byId.get(c.status_entity)); } const L_=byId.get(c.light); s.lamp = unavailable(L_) ? null : { on:L_.state==='on', pct: L_.state==='on' ? Math.round((L_.attributes.brightness||0)/2.55) : 0, ts:new Date(L_.last_changed).getTime() }; for(const [k,eid] of Object.entries(s.ent)){ const e=byId.get(eid); if(unavailable(e)) continue; const t=new Date(e.last_updated||e.last_changed).getTime(); s.ts[k]=t; if(TEXT_KEYS.has(k)){ s.v[k]=e.state; continue; } const v=num(e.state); if(v===null){ s.v[k]=e.state; continue; } s.v[k]=v; pushHist(s,k,v,t); } } }

async function refreshFromHA(){ let all=null; try{ all = await haGet('api/states'); }catch(err){ all=null; } if(all){ allStatesCache = all; if(!entitiesMapped){ mapEntities(all); entitiesMapped=true; } applyStates(all); const t = new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); setStatus('connected', `Live από Home Assistant · ${t}`); } else { setStatus('error','Χωρίς σύνδεση με το Home Assistant'); } liveRender(); }
async function loadHistory(){ const start = new Date(Date.now() - HISTORY_HOURS*3600*1000).toISOString(); for(const c of COLUMNS){ if(c.fake) continue; const s=state[c.id]; const map = {}; for(const k of CHART_ORDER){ const eid=s.ent[k]; if(eid) map[eid]=k; } const ids = Object.keys(map); if(!ids.length) continue; try{ const data = await haGet(`api/history/period/${encodeURIComponent(start)}?filter_entity_id=${ids.join(',')}&minimal_response&no_attributes`); for(const series of data){ if(!series.length) continue; const key = map[series[0].entity_id]; if(!key) continue; const pts = series.map(p => ({ t:new Date(p.last_changed || p.last_updated).getTime(), v:num(p.state) })).filter(p => p.v !== null); if(pts.length) s.history[key] = downsample(pts, HISTORY_MAX_POINTS); } }catch(_){} } dashBuiltFor=null; cmpBuilt=false; liveRender(); }

function parkColors(p){ const known=p.known, occ=p.occupied; return { color:!known?'var(--color-text-muted)':(occ?'#e23b3b':'#27c24c'), bg:!known?'var(--color-surface-offset)':(occ?'rgba(226,59,59,0.13)':'rgba(39,194,76,0.13)'), label:!known?'Άγνωστο':(occ?'Πιασμένο':'Ελεύθερο'), ico:!known?'❓':(occ?'🚗':'🅿️') }; }

function updateChartsInPlace(id){ const c=COLUMNS.find(x=>x.id===id); const s=state[id]; const M=colMetrics(c); if(M.charts.some(k=>!activeCharts['ch-'+k])){ renderDashboard(id); return; } M.charts.forEach(k=>{ const ch=activeCharts['ch-'+k]; ch.data.datasets[0].data=(s.history[k]||[]).map(p=>({x:p.t,y:p.v})); setX(ch); ch.update('none'); }); }

  document.getElementById('charts-grid').innerHTML = M.charts.map(k=>`<div class="chart-card"><div class="chart-title">${META[k].label}${META[k].unit?` (${META[k].unit})`:''}</div><div class="chart-wrap"><canvas id="ch-${k}"></canvas></div></div>`).join('');

  dashBuiltFor = id;
}
/* ---------- ΣΥΓΚΡΙΣΗ: πολυγραμμικά γραφήματα των πραγματικών κολωνών ---------- */
function realCols(){ return COLUMNS.filter(c=>!c.fake); }
// Μόνο μετρήσεις που έχουν τουλάχιστον δύο κολώνες (ή μία, αν υπάρχει μόνο μία)
function cmpMetrics(){ const rc=realCols(); const need=Math.min(2, rc.length); return CHART_ORDER.filter(k=>rc.filter(c=>state[c.id].ent[k]).length>=need && need>0); }
function cmpNowHTML(key){ const m=META[key]; return realCols().filter(c=>state[c.id].ent[key]).map(c=>`<div class="cmp-now-item"><span class="cmp-dot" style="background:${c.color}"></span>${esc(c.name)}: <b style="color:${c.color}">${fmt(val(c,key),m.d)}${m.unit?' '+m.unit:''}</b></div>`).join(''); }
function minmax(hist){ if(!hist||!hist.length) return null; let mn=Infinity,mx=-Infinity; for(const p of hist){ const v=p.v; if(v==null||!Number.isFinite(v)) continue; if(v<mn)mn=v; if(v>mx)mx=v; } return mn===Infinity?null:{min:mn,max:mx}; }
function cmpMMHTML(key){ const m=META[key]; return realCols().filter(c=>state[c.id].ent[key]).map(c=>{ const mm=minmax(state[c.id].history[key]); const t=mm?`min ${fmt(mm.min,m.d)} · max ${fmt(mm.max,m.d)}${m.unit?' '+m.unit:''}`:'—'; return `<div class="cmp-mm-row"><span class="cmp-dot" style="background:${c.color}"></span><span class="cmp-mm-name">${esc(c.name)}</span><span class="cmp-mm-val">${t}</span></div>`; }).join(''); }
function mkMultiChart(id, series, unit){ const ctx=document.getElementById(id); if(!ctx) return; const {grid,txt}=chartColors(); const datasets=series.map(s=>({label:s.label,data:(s.hist||[]).map(p=>({x:p.t,y:p.v})),borderColor:s.color,backgroundColor:s.color+'22',fill:false,tension:0.4,borderWidth:2,pointRadius:0,pointHoverRadius:4})); cmpCharts[id]=new Chart(ctx,{type:'line',data:{datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:true,labels:{color:txt,boxWidth:10,usePointStyle:true,font:{size:11}}},tooltip:{callbacks:{title:items=>items.length?timeTick(items[0].parsed.x):'',label:c=>` ${c.dataset.label}: ${c.parsed.y} ${unit}`}}},scales:{x:{type:'linear',...xRange(),ticks:{color:txt,maxTicksLimit:6,font:{size:10},callback:timeTick},grid:{color:grid}},y:{ticks:{color:txt,font:{size:10}},grid:{color:grid}}},animation:{duration:0}}}); }
let cmpKeys = [];
function buildComparison(){ const wrap=document.getElementById('cmp-charts'); Object.values(cmpCharts).forEach(ch=>{try{ch.destroy()}catch(_){}}); cmpCharts={}; cmpKeys=cmpMetrics(); if(!cmpKeys.length){ wrap.innerHTML='<div class="ov-sub">Δεν υπάρχουν ακόμη κοινές μετρήσεις για σύγκριση.</div>'; cmpBuilt=true; return; } wrap.innerHTML=cmpKeys.map(k=>{ const m=META[k]; return `<div class="chart-card cmp-chart-card"><div class="chart-title">${m.label}${m.unit?` (${m.unit})`:''}</div><div class="cmp-now" id="cmpnow-${k}">${cmpNowHTML(k)}</div><div class="chart-wrap cmp-wrap"><canvas id="cmp-${k}"></canvas></div><div class="cmp-mm" id="cmpmm-${k}">${cmpMMHTML(k)}</div></div>`; }).join(''); for(const k of cmpKeys){ mkMultiChart('cmp-'+k, realCols().filter(c=>state[c.id].ent[k]).map(c=>({label:c.name,color:c.color,hist:state[c.id].history[k]})), META[k].unit); } cmpBuilt=true; }
function updateComparison(){ if(cmpMetrics().join()!==cmpKeys.join()){ buildComparison(); return; } for(const k of cmpKeys){ const ch=cmpCharts['cmp-'+k]; if(ch){ realCols().filter(c=>state[c.id].ent[k]).forEach((c,i)=>{ if(ch.data.datasets[i]) ch.data.datasets[i].data=(state[c.id].history[k]||[]).map(p=>({x:p.t,y:p.v})); }); setX(ch); ch.update('none'); } const nn=document.getElementById('cmpnow-'+k); if(nn) nn.innerHTML=cmpNowHTML(k); const mm=document.getElementById('cmpmm-'+k); if(mm) mm.innerHTML=cmpMMHTML(k); } }
/* ---------- ΕΠΙΣΚΟΠΗΣΗ ---------- */
function lightVal(c){ const lux=val(c,'lux'); if(lux!==null && typeof lux==='number') return `${fmt(lux,0)} lx`; return fmt(val(c,'ldr'),0); }
function buildOverview(){ const onlineN=COLUMNS.filter(isOnline).length; const dirtyN=COLUMNS.filter(c=>{ const v=pollutionIndex(c); return v!==null&&v>=65; }).length; const litN=COLUMNS.filter(c=>state[c.id].lamp&&state[c.id].lamp.on).length; document.getElementById('ov-sub').textContent=`${COLUMNS.length} κολώνες · ${onlineN} online · ${litN} λάμπες αναμμένες · ${dirtyN} σε υψηλή ρύπανση`; document.getElementById('ov-grid').innerHTML = COLUMNS.map(col=>{ const pv = pollutionIndex(col); const hl=headline(col); return `<div class="ov-card" style="--ov-accent:${col.color}" data-col="${esc(col.id)}" onclick="openDashboard(this.dataset.col)" role="button" tabindex="0"><div class="ov-header"><div class="ov-dot" style="background:${col.color}"></div><div><div class="ov-name">${esc(col.name)}${col.fake?' · demo':''}</div><div class="ov-street">${esc(col.location)}</div></div>${isOnline(col)?'':'<span class="trend down" style="margin-left:auto">◌ Offline</span>'}</div><div class="ov-metrics"><div class="ov-m"><div class="ov-ml">Λάμπα</div><div class="ov-mv" style="color:${col.color}">${lampText(col)}</div></div>${hl.slice(0,3).map(k=>`<div class="ov-m"><div class="ov-ml">${META[k].label}</div><div class="ov-mv" style="color:${col.color}">${fmtKey(col,k)}</div></div>`).join('')}</div>${pv!==null?`<div class="ov-poll" style="background:${pollutionColor(pv)}22;color:${pollutionColor(pv)}">◍ Ρύπανση: ${pollutionLabel(pv)} (${Math.round(pv)})</div>`:''}${hasParking(col)?parkOvBadge(col):''}<button class="btn-dashboard" style="margin-top:var(--space-4)">Dashboard →</button></div>`; }).join(''); document.getElementById('cmp-tbody').innerHTML = COLUMNS.map(col=>{ const online = isOnline(col); const pv = pollutionIndex(col); return `<tr><td><span class="col-badge" style="background:${col.color}22;color:${col.color}">${esc(col.name)}</span></td><td>${fmt(val(col,'temperature'))}</td><td>${fmt(val(col,'humidity'),0)}</td><td>${fmt(val(col,'eco2'),0)}</td><td>${lightVal(col)}</td><td>${fmt(val(col,'pressure'))}</td><td>${lampText(col)}</td><td>${pv!==null?`<span class="trend" style="background:${pollutionColor(pv)}22;color:${pollutionColor(pv)}">${pollutionLabel(pv)}</span>`:'—'}</td><td><span class="trend ${online?'up':'down'}">${online?'● Online':'◌ Offline'}</span></td></tr>`; }).join(''); }
/* ---------- ΕΛΕΓΧΟΣ ΑΙΣΘΗΤΗΡΩΝ ---------- */
function runDiagnostics(){ if(!allStatesCache){ alert('Δεν υπάρχουν ακόμη δεδομένα από το Home Assistant. Δοκίμασε ξανά σε λίγα δευτερόλεπτα.'); return; } const byId=new Map(allStatesCache.map(e=>[e.entity_id,e])); let html=''; for(const c of realCols()){ const s=state[c.id]; const row=(k,eid)=>{ const e=byId.get(eid); const ok=e&&!unavailable(e); return `<div class="diag-row ${ok?'ok':'bad'}"><span>${esc(k)}</span><code>${esc(eid)}</code><b>${ok?esc(e.state):(e?esc(e.state):'ΛΕΙΠΕΙ')}</b></div>`; }; let rows=row('λάμπα',c.light)+row('παρουσία',c.presence)+(c.status_entity?row('status',c.status_entity):''); for(const [k,eid] of Object.entries(s.ent)){ if(k==='presence' || eid===c.status_entity) continue; rows+=row(k,eid); } for(const eid of s.others) rows+=row('άλλο',eid); const devN=(deviceEntities[c.id]||[]).length; html+=`<div class="diag-col"><div class="diag-h" style="color:${c.color}">${esc(c.name)}${c.location?' — '+esc(c.location):''}</div>${rows}<div class="diag-all">Βρέθηκαν μέσω: συσκευής του αισθητήρα παρουσίας (${devN} entities) και entity_match <code>${esc((c.entity_match||[]).join(', ')||'—')}</code></div></div>`; } showDiag(html); }
function showDiag(html){ let o=document.getElementById('diag-overlay'); if(!o){ o=document.createElement('div'); o.id='diag-overlay'; o.className='diag-overlay'; o.addEventListener('click',e=>{ if(e.target===o) closeDiag(); }); document.body.appendChild(o); } o.innerHTML=`<div class="diag-box"><div class="diag-top"><div class="diag-title">🔍 Έλεγχος αισθητήρων</div><button class="diag-close" onclick="closeDiag()">Κλείσιμο</button></div><p style="font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:14px;line-height:1.5">Πράσινο = παίρνει τιμή. Κόκκινο = το entity λείπει ή είναι unavailable. Αν λείπουν αισθητήρες μιας κολώνας, πρόσθεσε στο <code>entity_match</code> της (ρυθμίσεις add-on) ένα κομμάτι του entity_id τους, π.χ. <code>col1, kolona_1</code>.</p>${html}</div>`; o.style.display='flex'; }
function closeDiag(){ const o=document.getElementById('diag-overlay'); if(o) o.style.display='none'; }
document.getElementById('theme-btn').addEventListener('click',()=>{ dark = !dark; document.documentElement.setAttribute('data-theme', dark?'dark':'light'); document.getElementById('theme-btn').textContent = dark?'☾':'☀'; applyMapTheme(); if(currentView==='dashboard') renderDashboard(currentDashCol); if(currentView==='comparison'){ cmpBuilt=false; buildComparison(); } });
async function loadConfig(){ try{ const r=await fetch(BASE+'config.json',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }catch(e){ return { error:'Δεν φορτώθηκε το config.json ('+e.message+')', poles:[] }; } }
function showCfgError(msg){ const el=document.getElementById('cfg-error'); el.textContent='⚠ '+msg; el.style.display='block'; }
document.addEventListener('DOMContentLoaded', async ()=>{ const _r=parseHash(); if(_r.embed) document.body.classList.add('embed'); CFG = await loadConfig(); if(CFG.error) showCfgError(CFG.error); else if(!CFG.poles.length) showCfgError('Δεν έχουν οριστεί κολώνες στις ρυθμίσεις του add-on.'); COLUMNS = CFG.poles.map(p=>({...p})); const realCenter = COLUMNS.length ? [COLUMNS.reduce((a,c)=>a+c.lat,0)/COLUMNS.length, COLUMNS.reduce((a,c)=>a+c.lng,0)/COLUMNS.length] : [38.2465,21.7347]; if(CFG.demo_poles) COLUMNS = COLUMNS.concat(makeDemoPoles(realCenter)); initState(); for(let i=0;i<20;i++) simulateFake(); initMap(); buildStrip(); applyInitialRoute(); setStatus('connecting','Σύνδεση με Home Assistant…'); await discoverDevices(); await refreshFromHA(); loadHistory(); setTimeout(fitPoles,300); setInterval(liveTick, RENDER_MS); setInterval(refreshFromHA, POLL_MS); setInterval(()=>{ entitiesMapped=false; }, 5*60*1000); });
window.addEventListener('hashchange', ()=>{ const r=parseHash(); const cur=currentView==='dashboard'?'dashboard-'+currentDashCol:currentView; const want=r.view==='dashboard'?'dashboard-'+r.col:(r.view||'map'); if(cur!==want) applyInitialRoute(); });

document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.classList.contains('ov-card')) e.target.click(); });
</script>
